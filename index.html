
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの性格診断</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(135deg, #b8d8ff, #e9d2ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container {
  background: white;
  padding: 35px 25px;
  border-radius: 25px;
  width: 100%;
  max-width: 450px;
  text-align: center;
  box-shadow: 0 8px 25px #7774;
}
h1 {
  color: #7163b5;
}
.question {
  font-size: 19px;
  margin: 25px 0;
}
button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: none;
  border-radius: 12px;
  background: #a99be8;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #8170ce;
}
#result {
  font-size: 19px;
  color: #7163b5;
  font-weight: bold;
  margin-top: 25px;
}
</style>
</head>
<body>

<div class="container">
  <h1>🌷 あなたの性格診断 🌷</h1>
  <p id="number">質問 1 / 3</p>
  <p class="question" id="question">
    休日は何をして過ごしたい？
  </p>

  <div id="choices">
    <button onclick="answer(0)">友達と遊ぶ</button>
    <button onclick="answer(1)">家でゆっくりする</button>
  </div>

  <div id="result"></div>
</div>

<script>
const questions = [
  {
    text: "休日は何をして過ごしたい？",
    choices: ["友達と遊ぶ", "家でゆっくりする"]
  },
  {
    text: "グループではどんな役割？",
    choices: ["みんなを盛り上げる", "周りをサポートする"]
  },
  {
    text: "新しいことに挑戦するときは？",
    choices: ["すぐに挑戦する", "じっくり考えてから"]
  }
];

let current = 0;
let scores = [0, 0];

function answer(choice) {
  scores[choice]++;
  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showQuestion() {
  document.getElementById("number").textContent =
    `質問 ${current + 1} / 3`;

  document.getElementById("question").textContent =
    questions[current].text;

  document.getElementById("choices").innerHTML = "";

  questions[current].choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.textContent = choice;
    button.onclick = () => answer(index);
    document.getElementById("choices").appendChild(button);
  });
}

function showResult() {
  const result = scores[0] >= scores[1]
    ? "明るく行動的なチャレンジャータイプ！"
    : "落ち着いて考えるマイペースタイプ！";

  document.getElementById("number").textContent = "診断完了！";
  document.getElementById("question").textContent =
    "あなたの診断結果は……";
  document.getElementById("choices").innerHTML = "";
  document.getElementById("result").textContent = result;

  const retry = document.createElement("button");
  retry.textContent = "もう一度診断する";
  retry.onclick = () => location.reload();
  document.getElementById("choices").appendChild(retry);
}
</script>

</body>
</html>
